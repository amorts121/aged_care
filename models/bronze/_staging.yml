version: 2

models:
  - name: stg_provider
    description: "One row per aged care provider, lightly typed from raw source."
    columns:
      - name: provider_id
        description: "Natural key for the provider."
        tests:
          - unique
          - not_null

  - name: stg_case
    description: "One row per case record raised against a provider (complaints, notifications, reviews, sanctions)."
    columns:
      - name: case_id
        description: "Natural key for the case. NOTE: currently failing unique — duplicate load from source, live demo talking point."
        tests:
          - unique
          - not_null
      - name: provider_id
        description: "FK to stg_provider. NOTE: currently failing relationships — a case references a provider not present in the provider extract."
        data_tests:
          - not_null
          - relationships:
              arguments: # available in v1.10.5 and higher. Older versions can set the <argument_name> as the top-level property.
                to: ref('stg_provider')
                field: provider_id
      - name: subtype_code
        description: "Case subtype classification. NOTE: currently failing not_null (blank in source) and accepted_values (SANCTION not yet in the documented list)."
        data_tests:
          - not_null
          - accepted_values: 
              arguments:
                values: ['COMPLAINT', 'NOTIFICATION', 'REVIEW']
      - name: created_date
        description: "Date the case was raised. NOTE: currently failing not_null."
        tests:
          - not_null
