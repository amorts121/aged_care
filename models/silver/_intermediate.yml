version: 2

models:
  - name: int_case_subtype
    description: "Case Subtype model — cases joined to their provider, with derived days_open. Anchor model for the workshop demo."
    columns:
      - name: case_id
        tests:
          - unique
          - not_null
      - name: days_open
        description: "Days between case creation and last update (or today if still open)."
        tests:
          - not_null